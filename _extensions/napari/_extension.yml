title: napari
author: Tim Monko
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      theme: [napari.scss]
      width: 1280
      height: 720
      margin: 0
      min-scale: 0.2
      max-scale: 2.0
      center: false
      transition: none
      background-transition: none
      controls: false
      progress: false
      slide-number: c/t
      hash: true
      menu: false
      fig-format: svg
      code-line-numbers: false
      highlight-style: nord
      include-in-header: header.html
      include-after-body: after-body.html
