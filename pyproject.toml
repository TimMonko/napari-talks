[project]
name = "napari-talks"
version = "0.1.0"
description = "Slides for talks about napari"
requires-python = ">=3.13"
# what a talk needs to render (plot cells run at render time)
dependencies = [
    "jupyter",
    "matplotlib",
    "pandas",
    "nps",
]

[dependency-groups]
# local only: live demos and regenerating napari screenshots
demos = [
    "napari[pyqt6]",
    "scikit-image",
    "imageio",
    "pooch",
    "geopy",  # team map: geocode each place once
]

# pixi manages every environment: dependency groups map to features of the
# same name; conda-only tools (Quarto) come from conda-forge.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.13.*"
quarto = ">=1.11"

[tool.pixi.pypi-dependencies]
# nps is private until its site is up; switch to a git dependency then
nps = { path = "../../nps", editable = true }  # team-map worktree only; main uses ../nps

[tool.pixi.tasks]
render = "quarto render"
preview = { cmd = "quarto preview", description = "Preview the site; pass a talk, e.g. talks/2026-11-cbias/index.qmd" }

[tool.pixi.feature.demos.tasks]
runner = { cmd = "python shared/runner/runner.py", description = "Local server so demo slides can launch napari" }
screenshots = "python shared/demos/screenshots.py"
team-roster = { cmd = "python shared/demos/team_data.py roster", description = "Parse napari/docs team.md into shared/data/team.toml" }
team-geocode = { cmd = "python shared/demos/team_data.py geocode", description = "Fill lat/lon for each place in team.toml" }
team-avatars = { cmd = "python shared/demos/team_data.py avatars", description = "Cache GitHub avatars into shared/data/avatars" }
team-map = { cmd = "python shared/demos/team_map.py", description = "Open the napari team map" }

[tool.pixi.environments]
default = { solve-group = "default" }
demos = { features = ["demos"], solve-group = "default" }
