name: Publish slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: napari-talks
    steps:
      - uses: actions/checkout@v4
        with:
          path: napari-talks

      # nps is a path dependency (../nps) until it is published as a git dependency
      - uses: actions/checkout@v4
        with:
          repository: TimMonko/nps
          path: nps

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-path: napari-talks/pyproject.toml
          cache: true

      - name: Render all talks
        run: pixi run render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: napari-talks/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
